<style>
:root{
  --bg:#faf9f7; --card:#fff; --text:#2b2b2b; --muted:#8a8a8a; --accent:#3d7a5c; --border:#e4e0da;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1c1b19; --card:#262523; --text:#eee; --muted:#999; --accent:#6fbf94; --border:#3a3835; }
}
:root[data-theme="dark"]{ --bg:#1c1b19; --card:#262523; --text:#eee; --muted:#999; --accent:#6fbf94; --border:#3a3835; }
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
.wrap{max-width:480px;margin:0 auto;padding:16px;}
h1{font-size:1.2rem;margin:4px 0 16px;}
select,input,button{font-size:1rem;font-family:inherit;}
.row{display:flex;gap:8px;margin-bottom:10px;align-items:center;}
select{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);}
button{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;}
button.primary{background:var(--accent);color:#fff;border:none;}
.filters{display:flex;gap:8px;margin-bottom:12px;}
.filters button{flex:1;}
.filters button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
ul{list-style:none;margin:0;padding:0;}
li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);}
li span{flex:1;}
li.done span{color:var(--muted);text-decoration:line-through;}
li input[type=checkbox]{width:20px;height:20px;}
.del{color:var(--muted);background:none;border:none;font-size:1.1rem;cursor:pointer;padding:2px 6px;}
.addform{display:flex;gap:8px;margin-top:14px;}
.addform input{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);}
.share{margin-top:24px;border-top:1px solid var(--border);padding-top:14px;}
.share a{word-break:break-all;color:var(--accent);font-size:.85rem;}
#qrcode{margin-top:10px;display:flex;justify-content:center;}
.empty{color:var(--muted);text-align:center;padding:20px 0;}
.small{font-size:.8rem;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛒 Mes listes de courses</h1>

  <div class="row">
    <select id="listSelect"></select>
    <button id="newListBtn" title="Nouvelle liste">＋</button>
    <button id="delListBtn" title="Supprimer la liste">🗑</button>
  </div>

  <div class="filters">
    <button id="filterAll" class="active">Toute la liste</button>
    <button id="filterToBuy">À acheter</button>
  </div>

  <ul id="items"></ul>
  <div id="emptyMsg" class="empty" style="display:none;"></div>

  <form class="addform" id="addForm">
    <input id="newItem" placeholder="Ajouter un article…" autocomplete="off">
    <button class="primary" type="submit">Ajouter</button>
  </form>

  <div class="share">
    <button id="shareBtn">🔗 Partager cette liste (conjoint, vacances…)</button>
    <div id="sharePanel" style="display:none;">
      <p class="small">Ouvre ce lien ou scanne le QR code pour voir/cocher la même liste :</p>
      <a id="shareLink" href="#" target="_blank"></a>
      <div id="qrcode"></div>
    </div>
  </div>
  <p class="small" id="syncStatus" style="margin-top:16px;"></p>
</div>

<script id="app-state" type="application/json">{"lists":[{"id":"l1","name":"Ma liste","items":[]}],"activeListId":"l1","filter":"all"}</script>

<script>
let state = JSON.parse(document.getElementById('app-state').textContent);
let artifactApi = null;
let localOnly = false;

function uid(){ return 'i' + Date.now() + Math.random().toString(36).slice(2,7); }

function activeList(){ return state.lists.find(l => l.id === state.activeListId) || state.lists[0]; }

function render(){
  const sel = document.getElementById('listSelect');
  sel.innerHTML = state.lists.map(l => `<option value="${l.id}" ${l.id===state.activeListId?'selected':''}>${escapeHtml(l.name)}</option>`).join('');

  document.getElementById('filterAll').classList.toggle('active', state.filter==='all');
  document.getElementById('filterToBuy').classList.toggle('active', state.filter==='tobuy');

  const list = activeList();
  const items = list ? list.items : [];
  const shown = state.filter === 'tobuy' ? items.filter(i=>i.checked) : items;

  const ul = document.getElementById('items');
  const emptyMsg = document.getElementById('emptyMsg');
  if(shown.length === 0){
    ul.innerHTML = '';
    emptyMsg.style.display = 'block';
    emptyMsg.textContent = state.filter==='tobuy' ? 'Rien à acheter pour l\'instant.' : 'Liste vide — ajoute un article.';
  } else {
    emptyMsg.style.display = 'none';
    ul.innerHTML = shown.map(i => `
      <li class="${i.checked?'done':''}" data-id="${i.id}">
        <input type="checkbox" ${i.checked?'checked':''}>
        <span>${escapeHtml(i.name)}</span>
        <button class="del" title="Supprimer">✕</button>
      </li>`).join('');
  }

  const link = location.href;
  document.getElementById('shareLink').href = link;
  document.getElementById('shareLink').textContent = link;
  document.getElementById('syncStatus').textContent = localOnly
    ? 'Enregistré sur cet appareil uniquement.'
    : 'Liste synchronisée — les modifications sont partagées avec ce lien.';
}

function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function persist(){
  render();
  if (localOnly) {
    try{ localStorage.setItem('courses-state', JSON.stringify(state)); }catch(e){}
    return;
  }
  try{
    if(!artifactApi){ localOnly = true; render(); return; }
    const doc = '<!DOCTYPE html>\n' + document.documentElement.outerHTML.replace(
      /(<script id="app-state" type="application\/json">)[\s\S]*?(<\/script>)/,
      (m,a,b) => a + JSON.stringify(state) + b
    );
    await artifactApi.publish(doc);
  }catch(e){
    localOnly = true;
    try{ localStorage.setItem('courses-state', JSON.stringify(state)); }catch(_e){}
    render();
  }
}

document.getElementById('listSelect').addEventListener('change', e => {
  state.activeListId = e.target.value; persist();
});
document.getElementById('newListBtn').addEventListener('click', () => {
  const name = prompt('Nom de la nouvelle liste (ex: Leclerc, Vacances…)');
  if(!name) return;
  const id = uid();
  state.lists.push({id, name, items:[]});
  state.activeListId = id;
  persist();
});
document.getElementById('delListBtn').addEventListener('click', () => {
  if(state.lists.length <= 1){ alert('Impossible de supprimer la dernière liste.'); return; }
  if(!confirm('Supprimer cette liste ?')) return;
  state.lists = state.lists.filter(l => l.id !== state.activeListId);
  state.activeListId = state.lists[0].id;
  persist();
});
document.getElementById('filterAll').addEventListener('click', () => { state.filter='all'; persist(); });
document.getElementById('filterToBuy').addEventListener('click', () => { state.filter='tobuy'; persist(); });

document.getElementById('items').addEventListener('click', e => {
  const li = e.target.closest('li'); if(!li) return;
  const id = li.dataset.id;
  const list = activeList();
  const item = list.items.find(i => i.id === id);
  if(e.target.matches('input[type=checkbox]')){ item.checked = e.target.checked; persist(); }
  else if(e.target.matches('.del')){ list.items = list.items.filter(i => i.id !== id); persist(); }
});

document.getElementById('addForm').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('newItem');
  const name = input.value.trim();
  if(!name) return;
  activeList().items.push({id: uid(), name, checked:false});
  input.value = '';
  persist();
});

document.getElementById('shareBtn').addEventListener('click', () => {
  const panel = document.getElementById('sharePanel');
  const isHidden = panel.style.display === 'none';
  panel.style.display = isHidden ? 'block' : 'none';
  if(isHidden && !panel.dataset.rendered){
    try{ new QRCode(document.getElementById('qrcode'), {text: location.href, width:140, height:140}); }catch(e){}
    panel.dataset.rendered = '1';
  }
});

(async function init(){
  try{
    const a = await claude.use('artifact');
    if(a){ artifactApi = a; }
    else { localOnly = true; const saved = localStorage.getItem('courses-state'); if(saved) state = JSON.parse(saved); }
  }catch(e){ localOnly = true; const saved = localStorage.getItem('courses-state'); if(saved) state = JSON.parse(saved); }
  render();
})();
</script>
</body>
</html>
